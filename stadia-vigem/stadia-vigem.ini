; stadia-vigem button settings. Put this file next to the stadia-vigem exe; it is read on every press.
;
; Buttons: Capture and Assistant (the two small buttons below the Stadia button).
; Value: keys joined with +, for example F5 or Ctrl+S, or Screenshot to save one. Empty: the button does nothing.
; Add ", hold 1s" (or ", hold 500ms") to send the keys only after the button has been held that long.
; CaptureHold / AssistantHold: keys for holding the button (1 second unless set with ", hold"). With these set,
; Capture / Assistant are sent on a short press instead (at release); only one of the two is sent.
; A section named after a game's exe (for example [Prey.exe]) applies while that game is in the foreground and
; replaces [default] completely. [default] applies to everything else.

[default]
; short press: screenshot, saved as PNG in Pictures\Screenshots (works in games that block the Windows key)
Capture=Screenshot
; held for 1 second: F9
CaptureHold=F9

[Prey.exe]
; quick save
Capture=F5
; quick load, only after a 1-second hold
Assistant=F9, hold 1s
