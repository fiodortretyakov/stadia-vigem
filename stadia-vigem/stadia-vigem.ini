; stadia-vigem button settings. Put this file next to the stadia-vigem exe; it is read on every press.
;
; Buttons: Capture and Assistant (the two small buttons below the Stadia button).
; Value: keys joined with +, for example F5 or Ctrl+S. Empty: the button does nothing.
; Add ", hold 1s" (or ", hold 500ms") to send the keys only after the button has been held that long.
; A section named after a game's exe (for example [Prey.exe]) applies while that game is in the foreground.
; [default] applies to everything else; without a matching section the buttons do nothing.

[Prey.exe]
; quick save
Capture=F5
; quick load, only after a 1-second hold
Assistant=F9, hold 1s
